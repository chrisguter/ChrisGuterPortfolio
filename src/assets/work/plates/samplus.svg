<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="presentation">
  <defs>
    <linearGradient id="sp-ground" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0" stop-color="#16131a"/>
      <stop offset="1" stop-color="#050408"/>
    </linearGradient>

    <radialGradient id="sp-bloom" gradientUnits="userSpaceOnUse" cx="612" cy="248" r="368">
      <stop offset="0" stop-color="#d9603c" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#d9603c" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#d9603c" stop-opacity="0"/>
    </radialGradient>

    <pattern id="sp-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 L 0 25" fill="none" stroke="#f6efe8" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Hatch, not colour, is what marks an option as ruled out. -->
    <pattern id="sp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M 0 0 L 0 8" stroke="#a9a0a8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#sp-ground)"/>
  <rect width="800" height="500" fill="url(#sp-grid)"/>
  <rect width="800" height="500" fill="url(#sp-bloom)"/>

  <!-- Option group labels -->
  <g fill="#a9a0a8" fill-opacity="0.35">
    <rect x="56" y="105" width="34" height="6"/>
    <rect x="56" y="173" width="28" height="6"/>
    <rect x="56" y="241" width="34" height="6"/>
    <rect x="56" y="309" width="26" height="6"/>
    <rect x="56" y="377" width="30" height="6"/>
  </g>

  <!-- Unselected options -->
  <g fill="#16131a" stroke="#f6efe8" stroke-opacity="0.12" stroke-width="1.1">
    <rect x="112" y="92" width="76" height="32" rx="2"/>
    <rect x="292" y="92" width="76" height="32" rx="2"/>
    <rect x="202" y="160" width="76" height="32" rx="2"/>
    <rect x="292" y="160" width="76" height="32" rx="2"/>
    <rect x="202" y="228" width="76" height="32" rx="2"/>
    <rect x="202" y="296" width="76" height="32" rx="2"/>
    <rect x="112" y="364" width="76" height="32" rx="2"/>
  </g>
  <g fill="#a9a0a8" fill-opacity="0.26">
    <rect x="124" y="101" width="34" height="4"/><rect x="124" y="111" width="22" height="4"/>
    <rect x="304" y="101" width="34" height="4"/><rect x="304" y="111" width="18" height="4"/>
    <rect x="214" y="169" width="30" height="4"/><rect x="214" y="179" width="22" height="4"/>
    <rect x="304" y="169" width="34" height="4"/><rect x="304" y="179" width="16" height="4"/>
    <rect x="214" y="237" width="34" height="4"/><rect x="214" y="247" width="20" height="4"/>
    <rect x="214" y="305" width="28" height="4"/><rect x="214" y="315" width="24" height="4"/>
    <rect x="124" y="373" width="34" height="4"/><rect x="124" y="383" width="18" height="4"/>
  </g>

  <!-- Ruled out by an earlier choice -->
  <g>
    <rect x="112" y="228" width="76" height="32" rx="2" fill="#0b090d" stroke="#f6efe8" stroke-opacity="0.07" stroke-width="1.1"/>
    <rect x="112" y="228" width="76" height="32" rx="2" fill="url(#sp-hatch)"/>
    <rect x="292" y="296" width="76" height="32" rx="2" fill="#0b090d" stroke="#f6efe8" stroke-opacity="0.07" stroke-width="1.1"/>
    <rect x="292" y="296" width="76" height="32" rx="2" fill="url(#sp-hatch)"/>
    <rect x="292" y="364" width="76" height="32" rx="2" fill="#0b090d" stroke="#f6efe8" stroke-opacity="0.07" stroke-width="1.1"/>
    <rect x="292" y="364" width="76" height="32" rx="2" fill="url(#sp-hatch)"/>
  </g>

