  <g>
    <rect x="202" y="92" width="76" height="32" rx="2" fill="#16131a" stroke="#d9603c" stroke-opacity="0.9" stroke-width="1.4"/>
    <rect x="202" y="92" width="76" height="32" rx="2" fill="#d9603c" fill-opacity="0.13"/>
    <circle cx="216" cy="108" r="3.5" fill="#d9603c"/>
    <rect x="228" y="106" width="34" height="4" fill="#f6efe8" fill-opacity="0.6"/>

    <rect x="112" y="160" width="76" height="32" rx="2" fill="#16131a" stroke="#d9603c" stroke-opacity="0.9" stroke-width="1.4"/>
    <rect x="112" y="160" width="76" height="32" rx="2" fill="#d9603c" fill-opacity="0.13"/>
    <circle cx="126" cy="176" r="3.5" fill="#d9603c"/>
    <rect x="138" y="174" width="30" height="4" fill="#f6efe8" fill-opacity="0.6"/>

    <rect x="292" y="228" width="76" height="32" rx="2" fill="#16131a" stroke="#d9603c" stroke-opacity="0.9" stroke-width="1.4"/>
    <rect x="292" y="228" width="76" height="32" rx="2" fill="#d9603c" fill-opacity="0.13"/>
    <circle cx="306" cy="244" r="3.5" fill="#d9603c"/>
    <rect x="318" y="242" width="32" height="4" fill="#f6efe8" fill-opacity="0.6"/>

    <rect x="112" y="296" width="76" height="32" rx="2" fill="#16131a" stroke="#d9603c" stroke-opacity="0.9" stroke-width="1.4"/>
    <rect x="112" y="296" width="76" height="32" rx="2" fill="#d9603c" fill-opacity="0.13"/>
    <circle cx="126" cy="312" r="3.5" fill="#d9603c"/>
    <rect x="138" y="310" width="28" height="4" fill="#f6efe8" fill-opacity="0.6"/>

    <rect x="202" y="364" width="76" height="32" rx="2" fill="#16131a" stroke="#d9603c" stroke-opacity="0.9" stroke-width="1.4"/>
    <rect x="202" y="364" width="76" height="32" rx="2" fill="#d9603c" fill-opacity="0.13"/>
    <circle cx="216" cy="380" r="3.5" fill="#d9603c"/>
    <rect x="228" y="378" width="34" height="4" fill="#f6efe8" fill-opacity="0.6"/>
  </g>

  <!-- Exclusion rules: a choice above closes an option below -->
  <g fill="none" stroke="#d9603c" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="5 5">
    <path d="M 240 124 L 240 142 L 100 142 L 100 244 L 112 244"/>
    <path d="M 330 260 L 330 296"/>
  </g>
  <g stroke="#d9603c" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round">
    <path d="M 143 237 L 157 251"/><path d="M 157 237 L 143 251"/>
    <path d="M 323 305 L 337 319"/><path d="M 337 305 L 323 319"/>
  </g>
  <g stroke="#a9a0a8" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round">
    <path d="M 323 373 L 337 387"/><path d="M 337 373 L 323 387"/>
  </g>

  <!-- Every row resolves into one line. The tick sits on the chosen option, so
       the rail never appears to issue from a rule that closed one. -->
  <g fill="#d9603c" fill-opacity="0.8">
    <path d="M 282 104 L 290 108 L 282 112 Z"/>
    <path d="M 192 172 L 200 176 L 192 180 Z"/>
    <path d="M 372 240 L 380 244 L 372 248 Z"/>
    <path d="M 192 308 L 200 312 L 192 316 Z"/>
    <path d="M 282 376 L 290 380 L 282 384 Z"/>
  </g>
  <g fill="none" stroke="#d9603c" stroke-opacity="0.4" stroke-width="1.1">
    <path d="M 378 108 L 404 108"/>
    <path d="M 378 176 L 404 176"/>
    <path d="M 378 244 L 404 244"/>
    <path d="M 378 312 L 404 312"/>
    <path d="M 378 380 L 404 380"/>
    <path d="M 404 108 C 464 108, 462 244, 520 244"/>
    <path d="M 404 176 C 464 176, 464 244, 520 244"/>
    <path d="M 404 244 L 520 244"/>
    <path d="M 404 312 C 464 312, 464 244, 520 244"/>
    <path d="M 404 380 C 464 380, 462 244, 520 244"/>
  </g>
  <g fill="#d9603c" fill-opacity="0.7">
    <circle cx="404" cy="108" r="3"/>
    <circle cx="404" cy="176" r="3"/>
    <circle cx="404" cy="244" r="3"/>
    <circle cx="404" cy="312" r="3"/>
    <circle cx="404" cy="380" r="3"/>
  </g>
  <circle cx="520" cy="244" r="5.5" fill="#0b090d" stroke="#d9603c" stroke-width="1.5"/>
  <circle cx="520" cy="244" r="2" fill="#d9603c"/>

  <path d="M 526 244 L 548 244 M 548 196 L 548 300 M 548 196 L 560 196 M 548 300 L 560 300"
        fill="none" stroke="#d9603c" stroke-width="1.4" stroke-opacity="0.85"/>

  <!-- The specification, one line -->
  <path d="M 560 176 L 752 176" stroke="#a9a0a8" stroke-opacity="0.18" stroke-width="1"/>
  <g fill="#a9a0a8" fill-opacity="0.28">
    <rect x="560" y="170" width="1.5" height="6"/>
    <rect x="599" y="170" width="1.5" height="6"/>
    <rect x="638" y="170" width="1.5" height="6"/>
    <rect x="677" y="170" width="1.5" height="6"/>
    <rect x="716" y="170" width="1.5" height="6"/>
    <rect x="750.5" y="170" width="1.5" height="6"/>
  </g>
  <g>
    <rect x="560" y="191.5" width="36" height="9" fill="#d9603c"/>
    <rect x="599" y="191.5" width="36" height="9" fill="#d9603c" fill-opacity="0.72"/>
    <rect x="638" y="191.5" width="36" height="9" fill="#d9603c" fill-opacity="0.5"/>
    <rect x="677" y="191.5" width="36" height="9" fill="#a9a0a8" fill-opacity="0.42"/>
    <rect x="716" y="191.5" width="36" height="9" fill="#a9a0a8" fill-opacity="0.28"/>
  </g>

  <!-- and one price field -->
  <rect x="560" y="272" width="192" height="56" fill="#0b090d" stroke="#d9603c" stroke-opacity="0.4" stroke-width="1.2"/>
  <g fill="none" stroke="#d9603c" stroke-opacity="0.85" stroke-width="1.6">
    <path d="M 560 284 L 560 272 L 572 272"/>
    <path d="M 740 272 L 752 272 L 752 284"/>
    <path d="M 560 316 L 560 328 L 572 328"/>
    <path d="M 740 328 L 752 328 L 752 316"/>
  </g>
  <rect x="574" y="288" width="3" height="24" fill="#d9603c" fill-opacity="0.5"/>
  <g fill="#f6efe8" fill-opacity="0.8">
    <rect x="611" y="288" width="13" height="24"/>
    <rect x="629" y="288" width="13" height="24"/>
    <rect x="647" y="288" width="13" height="24"/>
  </g>
  <circle cx="667" cy="308" r="2.5" fill="#d9603c"/>
  <g fill="#d9603c" fill-opacity="0.9">
    <rect x="675" y="288" width="13" height="24"/>
    <rect x="693" y="288" width="13" height="24"/>
  </g>
  <path d="M 611 320 L 706 320" stroke="#d9603c" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Registration marks -->
  <g fill="none" stroke="#a9a0a8" stroke-opacity="0.35" stroke-width="1.25">
    <path d="M 26 46 L 26 26 L 46 26"/>
    <path d="M 754 26 L 774 26 L 774 46"/>
    <path d="M 26 454 L 26 474 L 46 474"/>
    <path d="M 754 474 L 774 474 L 774 454"/>
