<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="presentation">
  <defs>
    <linearGradient id="bl-ground" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0" stop-color="#16131a"/>
      <stop offset="1" stop-color="#050408"/>
    </linearGradient>

    <radialGradient id="bl-bloom" gradientUnits="userSpaceOnUse" cx="592" cy="132" r="392">
      <stop offset="0" stop-color="#7ba7d9" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#7ba7d9" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7ba7d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bl-hubglow" gradientUnits="userSpaceOnUse" cx="400" cy="151" r="150">
      <stop offset="0" stop-color="#7ba7d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ba7d9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="bl-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 L 0 25" fill="none" stroke="#f6efe8" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- One contour row, repeated at widening intervals: the spacing does the
         perspective, so the field reads as cultivated ground without a horizon. -->
    <path id="bl-row" fill="none" d="M -20 372 C 120 328, 250 412, 392 370 C 520 332, 660 400, 820 352"/>
  </defs>

  <rect width="800" height="500" fill="url(#bl-ground)"/>
  <rect width="800" height="500" fill="url(#bl-grid)"/>
  <rect width="800" height="500" fill="url(#bl-bloom)"/>

  <g stroke-linecap="round">
    <use href="#bl-row" y="-122" stroke="#7ba7d9" stroke-opacity="0.10" stroke-width="1"/>
    <use href="#bl-row" y="-100" stroke="#a9a0a8" stroke-opacity="0.07" stroke-width="1"/>
    <use href="#bl-row" y="-76" stroke="#7ba7d9" stroke-opacity="0.14" stroke-width="1"/>
    <use href="#bl-row" y="-50" stroke="#a9a0a8" stroke-opacity="0.10" stroke-width="1"/>
    <use href="#bl-row" y="-22" stroke="#7ba7d9" stroke-opacity="0.19" stroke-width="1.1"/>
    <use href="#bl-row" y="8" stroke="#a9a0a8" stroke-opacity="0.13" stroke-width="1.1"/>
    <use href="#bl-row" y="42" stroke="#7ba7d9" stroke-opacity="0.24" stroke-width="1.2"/>
    <use href="#bl-row" y="80" stroke="#a9a0a8" stroke-opacity="0.15" stroke-width="1.3"/>
  </g>

  <!-- Plot divisions -->
  <g stroke="#a9a0a8" stroke-opacity="0.10" stroke-width="1" stroke-dasharray="4 8">
    <path d="M 250 246 L 250 500"/>
    <path d="M 560 232 L 560 500"/>
  </g>

  <circle cx="400" cy="151" r="150" fill="url(#bl-hubglow)"/>

  <circle cx="400" cy="151" r="92" fill="none" stroke="#7ba7d9" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 7"/>

  <!-- Edges. Drawn under the nodes, which carry an opaque fill. -->
  <g stroke="#7ba7d9" fill="none" stroke-width="1">
    <g stroke-opacity="0.5" stroke-width="1.2">
      <path d="M 400 151 L 164 221"/>
      <path d="M 400 151 L 636 207"/>
      <path d="M 400 151 L 404 302"/>
    </g>
    <g stroke-opacity="0.26">
      <path d="M 400 151 L 252 86"/>
      <path d="M 400 151 L 556 82"/>
      <path d="M 252 86 L 164 221"/>
      <path d="M 556 82 L 636 207"/>
      <path d="M 164 221 L 286 246"/>
      <path d="M 286 246 L 404 302"/>
      <path d="M 636 207 L 700 330"/>
      <path d="M 404 302 L 700 330"/>
      <path d="M 636 207 L 404 302"/>
    </g>
    <path d="M 164 221 L 86 336" stroke-opacity="0.34" stroke-dasharray="5 6"/>
  </g>

  <!-- Record nodes -->
  <g>
    <circle cx="252" cy="86" r="7" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="252" cy="86" r="2.5" fill="#7ba7d9"/>

    <circle cx="556" cy="82" r="7" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="556" cy="82" r="2.5" fill="#7ba7d9"/>

    <circle cx="86" cy="336" r="7" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="3 4"/>

    <circle cx="404" cy="302" r="9" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.85" stroke-width="1.3"/>
    <circle cx="404" cy="302" r="3" fill="#7ba7d9"/>

    <circle cx="700" cy="330" r="7" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="700" cy="330" r="2.5" fill="#7ba7d9"/>

    <circle cx="286" cy="246" r="7" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.75" stroke-width="1.2"/>
    <circle cx="286" cy="246" r="2.5" fill="#7ba7d9"/>
  </g>

  <!-- Record cards -->
  <g>
    <rect x="112" y="190" width="104" height="62" rx="2" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.45" stroke-width="1.15"/>
    <rect x="112" y="190" width="104" height="3" fill="#7ba7d9" fill-opacity="0.7"/>
    <rect x="126" y="206" width="68" height="3.5" fill="#f6efe8" fill-opacity="0.42"/>
    <rect x="126" y="218" width="48" height="3.5" fill="#a9a0a8" fill-opacity="0.42"/>
    <rect x="126" y="230" width="58" height="3.5" fill="#a9a0a8" fill-opacity="0.3"/>
  </g>

  <g>
    <rect x="584" y="176" width="104" height="62" rx="2" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.45" stroke-width="1.15"/>
    <rect x="584" y="176" width="104" height="3" fill="#7ba7d9" fill-opacity="0.7"/>
    <rect x="598" y="192" width="60" height="3.5" fill="#f6efe8" fill-opacity="0.42"/>
    <rect x="598" y="204" width="72" height="3.5" fill="#a9a0a8" fill-opacity="0.42"/>
    <rect x="598" y="216" width="42" height="3.5" fill="#a9a0a8" fill-opacity="0.3"/>
  </g>

  <g>
    <rect x="336" y="112" width="128" height="78" rx="2" fill="#0b090d" stroke="#7ba7d9" stroke-opacity="0.85" stroke-width="1.3"/>
    <rect x="336" y="112" width="128" height="4" fill="#7ba7d9"/>
    <rect x="352" y="134" width="88" height="4" fill="#f6efe8" fill-opacity="0.55"/>
    <rect x="352" y="148" width="64" height="4" fill="#a9a0a8" fill-opacity="0.5"/>
    <rect x="352" y="162" width="60" height="4" fill="#a9a0a8" fill-opacity="0.5"/>
    <rect x="436" y="160" width="8" height="8" fill="#7ba7d9"/>
  </g>

  <!-- Registration marks -->
  <g fill="none" stroke="#a9a0a8" stroke-opacity="0.35" stroke-width="1.25">
    <path d="M 26 46 L 26 26 L 46 26"/>
    <path d="M 754 26 L 774 26 L 774 46"/>
    <path d="M 26 454 L 26 474 L 46 474"/>
    <path d="M 754 474 L 774 474 L 774 454"/>
  </g>
</svg>
