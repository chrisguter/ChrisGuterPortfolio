<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="presentation">
  <defs>
    <linearGradient id="tf-ground" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="500">
      <stop offset="0" stop-color="#16131a"/>
      <stop offset="1" stop-color="#050408"/>
    </linearGradient>

    <radialGradient id="tf-bloom" gradientUnits="userSpaceOnUse" cx="440" cy="168" r="336">
      <stop offset="0" stop-color="#f5a65b" stop-opacity="0.21"/>
      <stop offset="0.55" stop-color="#f5a65b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f5a65b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tf-clock" gradientUnits="userSpaceOnUse" cx="700" cy="342" r="130">
      <stop offset="0" stop-color="#f5a65b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f5a65b" stop-opacity="0"/>
    </radialGradient>

    <pattern id="tf-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 L 0 25" fill="none" stroke="#f6efe8" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#tf-ground)"/>
  <rect width="800" height="500" fill="url(#tf-grid)"/>
  <rect width="800" height="500" fill="url(#tf-bloom)"/>
  <circle cx="700" cy="342" r="130" fill="url(#tf-clock)"/>

  <!-- The login path, up to the first gate -->
  <circle cx="78" cy="165" r="6" fill="#0b090d" stroke="#a9a0a8" stroke-opacity="0.5" stroke-width="1.25"/>
  <circle cx="78" cy="165" r="2" fill="#a9a0a8" fill-opacity="0.6"/>
  <g fill="none" stroke="#a9a0a8" stroke-opacity="0.45" stroke-width="1.25">
    <path d="M 84 165 L 146 165"/>
    <path d="M 324 165 L 390 165"/>
  </g>

  <path d="M 146 128 L 184 128" stroke="#a9a0a8" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="146" y="141" width="178" height="48" rx="2" fill="#16131a" stroke="#f6efe8" stroke-opacity="0.14" stroke-width="1.25"/>
  <g fill="#a9a0a8" fill-opacity="0.7">
    <circle cx="175" cy="165" r="4.5"/>
    <circle cx="199" cy="165" r="4.5"/>
    <circle cx="223" cy="165" r="4.5"/>
    <circle cx="247" cy="165" r="4.5"/>
    <circle cx="271" cy="165" r="4.5"/>
    <circle cx="295" cy="165" r="4.5"/>
  </g>

  <!-- The second gate -->
  <path d="M 440 103 L 490 122 L 490 172 C 490 200, 466 218, 440 227 C 414 218, 390 200, 390 172 L 390 122 Z"
        fill="#0b090d" stroke="#f5a65b" stroke-width="1.75" stroke-linejoin="round"/>
  <path d="M 440 116 L 478 130 L 478 170 C 478 191, 460 205, 440 212 C 420 205, 402 191, 402 170 L 402 130 Z"
        fill="none" stroke="#f5a65b" stroke-opacity="0.28" stroke-width="1" stroke-linejoin="round"/>
  <path d="M 428 146 A 12 12 0 0 1 452 146" fill="none" stroke="#f5a65b" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="#f5a65b" fill-opacity="0.9">
    <rect x="412" y="161.5" width="7" height="13"/>
    <rect x="422" y="161.5" width="7" height="13"/>
    <rect x="432" y="161.5" width="7" height="13"/>
    <rect x="442" y="161.5" width="7" height="13"/>
  </g>
  <g fill="none" stroke="#f5a65b" stroke-opacity="0.32" stroke-width="1">
    <rect x="452" y="161.5" width="7" height="13"/>
    <rect x="462" y="161.5" width="7" height="13"/>
  </g>

  <!-- Beyond the gate, still pending -->
  <path d="M 496 165 L 690 165" fill="none" stroke="#f5a65b" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7 7"/>
  <circle cx="712" cy="165" r="22" fill="none" stroke="#f5a65b" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 6"/>
  <rect x="698" y="151" width="28" height="28" rx="3" fill="#0b090d" stroke="#f5a65b" stroke-opacity="0.7" stroke-width="1.4"/>
  <path d="M 712 158 L 719 165 L 712 172 L 705 165 Z" fill="#f5a65b" fill-opacity="0.85"/>

  <!-- The gate is served by the code field below it -->
  <path d="M 249 306 L 249 296 L 631 296 L 631 306" fill="none" stroke="#f5a65b" stroke-opacity="0.3" stroke-width="1.25"/>
  <path d="M 440 296 L 440 233" fill="none" stroke="#f5a65b" stroke-opacity="0.3" stroke-width="1.25" stroke-dasharray="5 6"/>

  <!-- Six segments, four entered -->
  <g fill="#16131a" stroke="#f6efe8" stroke-opacity="0.14" stroke-width="1.25">
    <rect x="249" y="312" width="52" height="64" rx="2"/>
    <rect x="315" y="312" width="52" height="64" rx="2"/>
    <rect x="381" y="312" width="52" height="64" rx="2"/>
    <rect x="447" y="312" width="52" height="64" rx="2"/>
  </g>
  <g fill="#f5a65b" fill-opacity="0.9">
    <rect x="266" y="331" width="18" height="26" rx="2"/>
    <rect x="332" y="331" width="18" height="26" rx="2"/>
    <rect x="398" y="331" width="18" height="26" rx="2"/>
    <rect x="464" y="331" width="18" height="26" rx="2"/>
  </g>

  <rect x="513" y="312" width="52" height="64" rx="2" fill="#16131a" stroke="#f5a65b" stroke-width="1.6"/>
  <rect x="513" y="312" width="52" height="64" rx="2" fill="#f5a65b" fill-opacity="0.08"/>
  <rect x="537.5" y="326" width="2.5" height="36" fill="#f5a65b" fill-opacity="0.9"/>

  <rect x="579" y="312" width="52" height="64" rx="2" fill="#0b090d" stroke="#f6efe8" stroke-opacity="0.09" stroke-width="1.25"/>
  <rect x="597" y="362" width="16" height="2" fill="#a9a0a8" fill-opacity="0.25"/>

  <path d="M 249 386 L 631 386" stroke="#f6efe8" stroke-opacity="0.08" stroke-width="1"/>
  <g fill="#a9a0a8" fill-opacity="0.3">
    <rect x="274" y="390" width="2" height="7"/>
    <rect x="340" y="390" width="2" height="7"/>
    <rect x="406" y="390" width="2" height="7"/>
    <rect x="472" y="390" width="2" height="7"/>
    <rect x="538" y="390" width="2" height="7"/>
    <rect x="604" y="390" width="2" height="7"/>
  </g>

  <!-- and a short life -->
  <path d="M 638 342 L 664 342" fill="none" stroke="#f5a65b" stroke-opacity="0.25" stroke-width="1.25" stroke-dasharray="4 5"/>
  <circle cx="700" cy="342" r="30" fill="none" stroke="#f5a65b" stroke-opacity="0.16" stroke-width="3.5"/>
  <circle cx="700" cy="342" r="30" fill="none" stroke="#f5a65b" stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="64 124.5" transform="rotate(-90 700 342)"/>
  <circle cx="700" cy="342" r="3" fill="#f5a65b" fill-opacity="0.8"/>
  <g fill="none" stroke="#a9a0a8" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round">
    <path d="M 700 302 L 700 307"/>
    <path d="M 740 342 L 735 342"/>
    <path d="M 700 382 L 700 377"/>
    <path d="M 660 342 L 665 342"/>
  </g>

  <!-- Registration marks -->
  <g fill="none" stroke="#a9a0a8" stroke-opacity="0.35" stroke-width="1.25">
    <path d="M 26 46 L 26 26 L 46 26"/>
    <path d="M 754 26 L 774 26 L 774 46"/>
    <path d="M 26 454 L 26 474 L 46 474"/>
    <path d="M 754 474 L 774 474 L 774 454"/>
  </g>
</svg>
