name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI never needs to write to the repo. Deployment is a separate
# workflow with its own, narrower grant.
permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR. Only the newest commit matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # `npm ci`, never `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Vite strips TypeScript types without ever checking them, so the build
      # would happily emit code containing type errors. This step is what makes
      # TypeScript real.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Chromium only — matches the browsers the e2e suite targets and keeps the
      # install well under the cost of the full browser set.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
