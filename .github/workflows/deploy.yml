name: Deploy

# Gated behind CI, not parallel to it: triggering on push would deploy a commit
# whose tests are still running — or failing. workflow_run fires only after the
# CI workflow finishes, and the job guard below checks it actually passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # OIDC token: actions/deploy-pages authenticates to Pages with it rather than
  # with a long-lived repository token.
  id-token: write

# One deployment at a time, and never cancel one midway — a half-applied deploy
# is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # workflow_dispatch has no workflow_run payload, so it passes the guard.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The custom domain is committed as public/CNAME and copied into dist/ by
      # Vite. Fail loudly here rather than silently deploying a build that would
      # drop chrisguter.com and strand the domain.
      - name: Verify custom domain file
        run: test -s dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
